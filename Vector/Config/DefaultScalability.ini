; ---- 地形 ----
; 结论修正（2026-08-17 第三轮）：**本段刻意留空，不写任何 cvar。**
;
; 查证过程：引擎 BaseScalability.ini 只定义 10 类档位，
; 并不包含 LandscapeQuality —— 它仅作为 sg.LandscapeQuality 出现在
; BaseDeviceProfiles.ini 中。也就是说 Landscape 档位由 Landscape 模块
; 在自身加载时注册，不属于渲染核心的 Scalability 基线。
;
; 因此前两轮的做法都错了：
;   第一轮 landscape.RenderNaniteLandscape → deferred dummy
;   第二轮 r.LandscapeLODBias             → 同样 deferred dummy
; 原因是 Landscape 模块的加载时机晚于 Scalability 应用时机，
; 此刻写任何 Landscape 相关 cvar 都只会得到 dummy 占位。
;
; 本项目用 PCG 模块搭场景，不使用 Landscape 系统，
; 该类档位对我们没有任何实际作用。保留段落头是为了显式声明
; 「已评估、刻意留空」，避免以后有人再来填一遍重复踩坑。
[LandscapeQuality@0]

[LandscapeQuality@1]

[LandscapeQuality@2]

[LandscapeQuality@3]

; Intentionally empty: this project does not use Landscape.
