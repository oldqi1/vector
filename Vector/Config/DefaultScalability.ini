; ---- 抗锯齿 ----
; 对齐引擎 BaseScalability.ini 的 cvar 构成。
; 注意：官方并无 r.PostProcessAAQuality（那是旧写法），
; 实际用 r.FXAA.Quality / r.TemporalAA.Quality / r.TSR.* 分项控制。
;
; 本项目取向：TSR 的时间累积会糊掉高速小物体（动能球、碎块），
; 而那些物体的落点正是要玩家读的。故 TSR 历史与重投影按档递减，
; 高档也不追满。若后续裁决改用 FXAA，把 r.AntiAliasingMethod
; 写进 DefaultEngine.ini 即可，本段仍然有效。
[AntiAliasingQuality@0]
r.FXAA.Quality=0
r.TemporalAA.Quality=0
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=0
r.TSR.ShadingRejection.Flickering=0
r.TSR.RejectionAntiAliasingQuality=0
r.TSR.ReprojectionField=0
r.TSR.Resurrection=0

[AntiAliasingQuality@1]
r.FXAA.Quality=1
r.TemporalAA.Quality=1
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=1
r.TSR.ShadingRejection.Flickering=1
r.TSR.RejectionAntiAliasingQuality=1
r.TSR.ReprojectionField=0
r.TSR.Resurrection=1

[AntiAliasingQuality@2]
r.FXAA.Quality=3
r.TemporalAA.Quality=1
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=2
r.TSR.ShadingRejection.Flickering=1
r.TSR.RejectionAntiAliasingQuality=1
r.TSR.ReprojectionField=1
r.TSR.Resurrection=1

[AntiAliasingQuality@3]
r.FXAA.Quality=4
r.TemporalAA.Quality=2
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=3
r.TSR.ShadingRejection.Flickering=1
r.TSR.RejectionAntiAliasingQuality=2
r.TSR.ReprojectionField=1
r.TSR.Resurrection=1

; ============================================================
; 以下 5 类为 2026-08-17 补齐。
; UE 5.8 启动时实际请求 11 类档位段，初版只写了 6 类，
; 缺失的 5 类会静默回落到引擎默认值 —— 也就是没有档位控制。
; 已从日志 LogConfig "Applying CVar settings from Section" 核对齐全。
; ============================================================

; ---- 全局光照：Lumen 档位 ----
; 注意：这里控制的是 Lumen 的「质量」，不是开关。
; 开关在 DefaultEngine.ini 的 r.DynamicGlobalIlluminationMethod（待裁决）。
; 若后续裁决关掉 Lumen 改手工布光，本段自动失效，无需删除。
[GlobalIlluminationQuality@0]
r.DistanceFieldAO=0
r.Lumen.DiffuseIndirect.Allow=0
r.LumenScene.Radiosity.ProbeSpacing=8
r.Lumen.TraceMeshSDFs.Allow=0

[GlobalIlluminationQuality@1]
r.DistanceFieldAO=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.TraceMeshSDFs.Allow=0
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16

[GlobalIlluminationQuality@2]
r.DistanceFieldAO=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.TraceMeshSDFs.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32

[GlobalIlluminationQuality@3]
r.DistanceFieldAO=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.TraceMeshSDFs.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32

; ---- 反射：本项目平涂无镜面，全档保持最低 ----
; DefaultEngine.ini 已设 r.ReflectionMethod=0（关闭）。
; 这里全档压到最低，防止将来误开时悄悄产生成本。
[ReflectionQuality@0]
r.SSR.Quality=0
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.SSR.Quality=0
r.Lumen.Reflections.Allow=0

[ReflectionQuality@2]
r.SSR.Quality=0
r.Lumen.Reflections.Allow=0

[ReflectionQuality@3]
r.SSR.Quality=0
r.Lumen.Reflections.Allow=0

; ---- 着色质量 ----
; 对齐引擎 BaseScalability.ini 的 ShadingQuality 段构成：
; 官方该段只含 HairStrands 三项 + r.AnisotropicMaterials。
; 半透明光照体积（TranslucencyLightingVolume）不属于本段，
; 已移至 EffectsQuality —— 那才是官方的归属位置。
;
; 本项目取向：俯视平涂用不到各向异性；无毛发资产，
; HairStrands 全档压最低，省掉无意义的 shader 与采样成本。
[ShadingQuality@0]
r.AnisotropicMaterials=0
r.HairStrands.SkyLighting.IntegrationType=0
r.HairStrands.SkyAO.SampleCount=1
r.HairStrands.Visibility.MSAA.SamplePerPixel=1

[ShadingQuality@1]
r.AnisotropicMaterials=0
r.HairStrands.SkyLighting.IntegrationType=0
r.HairStrands.SkyAO.SampleCount=1
r.HairStrands.Visibility.MSAA.SamplePerPixel=1

[ShadingQuality@2]
r.AnisotropicMaterials=0
r.HairStrands.SkyLighting.IntegrationType=0
r.HairStrands.SkyAO.SampleCount=1
r.HairStrands.Visibility.MSAA.SamplePerPixel=1

[ShadingQuality@3]
r.AnisotropicMaterials=0
r.HairStrands.SkyLighting.IntegrationType=0
r.HairStrands.SkyAO.SampleCount=1
r.HairStrands.Visibility.MSAA.SamplePerPixel=1

