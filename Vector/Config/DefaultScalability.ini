; ============================================================
; Vector 画质档位基线
; 建立：2026-08-17（技术美术优化）
;
; 为什么需要这个文件：
;   原本 Config/ 下没有 DefaultScalability.ini，导致
;   1) 无 Low/Medium/High 预设，打包后玩家没有有效画质选项；
;   2) Niagara 的可扩展性分组失去项目级基线；
;   3) 「在 RTX 4070 上跑得动」不代表试玩者跑得动，而这是
;      定向机制验证包 —— 帧率崩了会被误判成手感问题。
;
; 档位约定：@0=Low  @1=Medium  @2=High  @3=Epic
; 本项目只认真维护 0/1/2 三档，Epic 沿用 High。
;
; 全档共同红线（不随画质变化，因为它们是功能不是画质）：
;   - MotionBlurQuality 恒为 0        —— 与落点可读性冲突
;   - 影子投影/落点环不走这里降级      —— 属可读性 P0，不可裁剪
; ============================================================

