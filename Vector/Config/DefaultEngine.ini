[/Script/Engine.RendererSettings]
; ============================================================
; 技术美术优化 2026-08-17
; 定位：俯视 3D · 风格化 low-poly 平涂 · 高动态刚体物理
; 原则：渲染预算只服务「落点 / 高度 / 结构状态」的可读性
; 备份：.workbuddy/backup_20260817_ta/DefaultEngine.ini.bak
; ============================================================

; ---- 保持不变 ----
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True

; 保留：Niagara 的 Distance Field Collision 依赖它。
; 用 DF 碰撞做碎屑/尘环比逐粒子物理碰撞便宜一个数量级，不要关。
r.GenerateMeshDistanceFields=True

; VSM 保留做氛围阴影；落点判读由独立的 LineTrace + SDF 圆 Quad 投影负责。
; 不要指望一套阴影同时兼顾氛围和落点判读，那是两个需求。
r.Shadow.Virtual.Enable=1

; ---- 关闭：本项目下为纯负收益（第一批，零争议） ----

; RayTracing 成本与本项目玩法正相关：BVH 对动态刚体需逐帧刷新，
; 而矢量枪推的物体、动能球、绳线摆荡目标、升空叉抛起物、碎块、
; Boss 布娃娃几乎全在动 —— 战斗越激烈越慢。
; 收益侧：俯视 + 三色平涂 + 无贴图 + 无镜面/玻璃/水面，RT 可见差异≈0。
r.RayTracing=False
r.RayTracing.RayTracingProxies.ProjectEnabled=False

; Substrate 服务多层材质（湿滑涂层叠泥土叠岩石）。本项目材质是
; Quaternius 三色平涂，无 BaseColor/Normal/Roughness 贴图，无层可分。
; 另：第三方 CC0/Fab 素材普遍针对旧 Shading Model 编写，
; 开着 Substrate 会导致导入后材质路径不一致，需逐个返修。
r.Substrate=False
r.Substrate.ProjectGBufferFormat=0

; Lumen Reflection：平涂无镜面材质，反射贡献≈0，纯成本。
r.ReflectionMethod=0

; ---- 全局光照：待裁决，暂保留 Lumen ----
; 1=Lumen（当前）。若改手工三点光则设 0，见文档 §1.4。
; 已知代价：Lumen 屏幕空间追踪 + 时间累积会让高速空中目标的
; 间接光滞后、出现拖影 —— 而那正是要玩家读落点的物体。
r.DynamicGlobalIlluminationMethod=1

; ---- 曝光：改手动，保护明度分层纪律 ----
; 自动曝光会让地面明度随镜头朝向变化。五色调色板要求地面恒定
; 锁在 L* 18%，不能因为转向变成 30%，否则整套明度语言失效。
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=2
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; ---- 运动模糊：必须为 0 ----
; 玩家要读高速物体的运动方向与落点，动态模糊在做完全相反的事。
; 这不是风格偏好，是功能冲突。
r.DefaultFeature.MotionBlur=False

; ---- 半透明排序：影子 Quad 与落点预测环需要稳定排序 ----
r.SeparateTranslucency=1

